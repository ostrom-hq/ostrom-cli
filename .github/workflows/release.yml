name: Release

# Cut a release by pushing a bare-semver tag `X.Y.Z` (CONVENTIONS section 12, docs/RELEASES.md). `workflow_dispatch`
# is a dry run: it builds, packs and signs everything, builds the runner image, and publishes nothing (no release, no
# image push, no tap push). A dry run never reads a signing secret: it runs on any branch and its artifacts can be
# downloaded, so it signs with throwaway keys made in the job, the same way, and checks itself against them. Only a tag
# signs with the release keys, and checks itself against the keys the installers and `ostrom update` pin. Never on pull requests (org CI rules, JOURNAL 03:10): rehearse with workflow_dispatch.
# No cache of any kind (no actions/cache, setup-gradle cache disabled): what is released and signed is built from
# scratch, never from a cache a pull request could have written (zizmor cache-poisoning).

on:
  push:
    tags: ['[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: Version label for the dry run (no leading v); empty is the version floor, `<floor>-dryrun`
        default: ''
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  version:
    name: version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      # The default dry-run label is the version floor's: a label under the floor (S2-39) stops latest-json.sh.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            release-floor.txt
            scripts/release
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # Before anything is published: the taps job trusts only these pins, and fails after the release if GitHub
      # rotated a key since (AUDIT-SECU-PUBLIC P8).
      - name: The pinned GitHub host keys are the published ones
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: sh scripts/release/check-github-host-keys.sh
      - id: v
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          if [ "$EVENT" = push ]; then
            version="$REF_NAME"
            publish=true
          else
            version="$INPUT_VERSION"
            # an unreadable floor stops here (set -e), never a bare `-dryrun`
            [ -n "$version" ] || version="$(tr -d ' \n\r' < release-floor.txt)-dryrun"
            publish=false
          fi
          case "$version" in
            ''|*[!0-9A-Za-z.+_-]*) echo "invalid version: $version" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  build-linux:
    name: build linuxX64, linuxArm64, mingwX64
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ostrom-core version
        id: core
        run: echo "ref=$(tr -d '[:space:]' < gradle/ostrom-core.ref)" >> "$GITHUB_OUTPUT"
      # GITHUB_TOKEN cannot read another repository's Maven packages: ostrom-core is built from its commit (05:50).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ostrom-hq/ostrom-core
          ref: ${{ steps.core.outputs.ref }}
          ssh-key: ${{ secrets.DEPLOY_KEY_CORE }}
          path: ostrom-core
          persist-credentials: false
      - name: Build ostrom-core from that checkout
        run: |
          mv ostrom-core ../ostrom-core
          mkdir -p ~/.gradle
          echo "ostrom.core.local=true" >> ~/.gradle/gradle.properties
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with: { cache-disabled: true }
      - name: Install libcurl (Ktor's Linux engine)
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Link the release executables
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: >-
          ./gradlew -PostromVersion="$VERSION"
          :cli:linkReleaseExecutableLinuxX64 :cli:linkReleaseExecutableLinuxArm64 :cli:linkReleaseExecutableMingwX64
      - name: Stage the binaries
        run: |
          set -eu
          mkdir -p staged/linux-x64 staged/linux-arm64 staged/windows-x64
          cp cli/build/bin/linuxX64/releaseExecutable/ostrom.kexe staged/linux-x64/ostrom
          cp cli/build/bin/linuxArm64/releaseExecutable/ostrom.kexe staged/linux-arm64/ostrom
          cp cli/build/bin/mingwX64/releaseExecutable/ostrom.exe staged/windows-x64/ostrom.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-linux
          path: staged
          if-no-files-found: error

  # macOS arm64 is the expensive runner: this is the only macOS job of the release.
  build-macos:
    name: build macosArm64
    needs: version
    runs-on: macos-15
    timeout-minutes: 60
    # A tag only: a dry run neither signs nor notarizes with the Developer ID.
    env:
      APPLE_CERTIFICATE_P12: ${{ needs.version.outputs.publish == 'true' && secrets.APPLE_CERTIFICATE_P12 || '' }}
      APPLE_CERTIFICATE_PASSWORD: ${{ needs.version.outputs.publish == 'true' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
      APPLE_SIGNING_IDENTITY: ${{ needs.version.outputs.publish == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
      APPLE_ID: ${{ needs.version.outputs.publish == 'true' && secrets.APPLE_ID || '' }}
      APPLE_TEAM_ID: ${{ needs.version.outputs.publish == 'true' && secrets.APPLE_TEAM_ID || '' }}
      APPLE_APP_PASSWORD: ${{ needs.version.outputs.publish == 'true' && secrets.APPLE_APP_PASSWORD || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ostrom-core version
        id: core
        run: echo "ref=$(tr -d '[:space:]' < gradle/ostrom-core.ref)" >> "$GITHUB_OUTPUT"
      # GITHUB_TOKEN cannot read another repository's Maven packages: ostrom-core is built from its commit (05:50).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ostrom-hq/ostrom-core
          ref: ${{ steps.core.outputs.ref }}
          ssh-key: ${{ secrets.DEPLOY_KEY_CORE }}
          path: ostrom-core
          persist-credentials: false
      - name: Build ostrom-core from that checkout
        run: |
          mv ostrom-core ../ostrom-core
          mkdir -p ~/.gradle
          echo "ostrom.core.local=true" >> ~/.gradle/gradle.properties
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with: { cache-disabled: true }
      - name: Link the release executable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: ./gradlew -PostromVersion="$VERSION" :cli:linkReleaseExecutableMacosArm64
      - name: Stage the binary
        run: |
          set -eu
          mkdir -p staged/macos-arm64
          cp cli/build/bin/macosArm64/releaseExecutable/ostrom.kexe staged/macos-arm64/ostrom
      # Skipped until Lyes provides a Developer ID Application certificate (see GESTES-LYES.md, section DEPLOY).
      - name: Sign with the Developer ID Application certificate
        if: ${{ env.APPLE_CERTIFICATE_P12 != '' && env.APPLE_SIGNING_IDENTITY != '' }}
        run: |
          set -eu
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password=$(uuidgen)
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          codesign --force --timestamp --options runtime --sign "$APPLE_SIGNING_IDENTITY" staged/macos-arm64/ostrom
          codesign --verify --strict --verbose=2 staged/macos-arm64/ostrom
      - name: Notarize
        if: ${{ env.APPLE_CERTIFICATE_P12 != '' && env.APPLE_SIGNING_IDENTITY != '' && env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_PASSWORD != '' }}
        run: |
          set -eu
          ditto -c -k --keepParent staged/macos-arm64/ostrom "$RUNNER_TEMP/ostrom-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/ostrom-notarize.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          # A bare Mach-O cannot be stapled; Gatekeeper finds the ticket online.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-macos
          path: staged
          if-no-files-found: error

  package:
    name: package, sign, SBOM
    needs: [version, build-linux, build-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PUBLISH: ${{ needs.version.outputs.publish }}
      # A tag only: a dry run does not Authenticode-sign.
      WINDOWS_CERTIFICATE_PFX: ${{ needs.version.outputs.publish == 'true' && secrets.WINDOWS_CERTIFICATE_PFX || '' }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ needs.version.outputs.publish == 'true' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: bins
          merge-multiple: true
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y jq osslsigncode zip
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      # Skipped until Lyes provides a Windows code signing certificate (see GESTES-LYES.md, section DEPLOY).
      - name: Authenticode-sign ostrom.exe
        if: ${{ env.WINDOWS_CERTIFICATE_PFX != '' }}
        run: |
          set -eu
          printf '%s' "$WINDOWS_CERTIFICATE_PFX" | base64 --decode > "$RUNNER_TEMP/win.pfx"
          osslsigncode sign -pkcs12 "$RUNNER_TEMP/win.pfx" -pass "$WINDOWS_CERTIFICATE_PASSWORD" \
            -n Ostrom -i https://ostrom.run -t http://timestamp.digicert.com \
            -in bins/windows-x64/ostrom.exe -out bins/windows-x64/ostrom.signed.exe
          mv bins/windows-x64/ostrom.signed.exe bins/windows-x64/ostrom.exe
          rm -f "$RUNNER_TEMP/win.pfx"
      - name: Archive
        run: |
          set -eu
          mkdir -p dist sbom
          for target in linux-x64 linux-arm64 macos-arm64; do
            chmod 755 "bins/$target/ostrom"
            cp LICENSE "bins/$target/LICENSE"
            tar -czf "dist/ostrom-$VERSION-$target.tar.gz" -C "bins/$target" ostrom LICENSE
            syft scan "file:bins/$target/ostrom" -o "spdx-json=sbom/ostrom-$VERSION-$target.spdx.json" -q
          done
          cp LICENSE bins/windows-x64/LICENSE
          (cd bins/windows-x64 && zip -q "../../dist/ostrom-$VERSION-windows-x64.zip" ostrom.exe LICENSE)
          syft scan "file:bins/windows-x64/ostrom.exe" -o "spdx-json=sbom/ostrom-$VERSION-windows-x64.spdx.json" -q
          cp sbom/*.spdx.json dist/
      - name: SHA256SUMS
        run: |
          set -eu
          cd dist
          sha256sum ostrom-* > SHA256SUMS
          cat SHA256SUMS
      # The public halves the self-check reads: the pinned ones on a tag, the throwaway ones of a dry run (made here).
      - name: Signing keys
        run: |
          set -eu
          keys="$RUNNER_TEMP/keys"; mkdir -p "$keys"; chmod 700 "$keys"
          if [ "$PUBLISH" = true ]; then
            printf '%s\n' '-----BEGIN PUBLIC KEY-----' 'MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAENbn5GmwW348HxCtTPQbNfcvHmSZG' \
              'G+IBNKubzv51TIua776a3875eoe5isQYKYmVwe5yTUU0v2k8Pu7WXQWoBg==' '-----END PUBLIC KEY-----' > "$keys/cosign.pub"
            printf '%s\n' '-----BEGIN PUBLIC KEY-----' 'MCowBQYDK2VwAyEAgWVuEFjR9qPX6DfIJ6Bhs+jT7j00KiwFY6bNwP0fexA=' \
              '-----END PUBLIC KEY-----' > "$keys/release.pub"
          else
            ( umask 077; openssl genpkey -algorithm ed25519 -out "$keys/release.key" )
            openssl pkey -in "$keys/release.key" -pubout -out "$keys/release.pub"
            ( cd "$keys" && COSIGN_PASSWORD='' cosign generate-key-pair >/dev/null )
          fi
      - name: Update manifest, signed with Ed25519
        env:
          RELEASE_SIGNING_KEY: ${{ needs.version.outputs.publish == 'true' && secrets.RELEASE_SIGNING_KEY || '' }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          [ "$PUBLISH" = true ] || RELEASE_SIGNING_KEY=$(cat "$RUNNER_TEMP/keys/release.key")
          export RELEASE_SIGNING_KEY
          base="https://github.com/$REPO/releases"
          sh scripts/release/latest-json.sh "$VERSION" "$base" dist > dist/latest.json
          jq . dist/latest.json
          sh scripts/release/sign-manifest.sh dist/latest.json
      - name: Sign archives and SHA256SUMS with cosign (key, no transparency log)
        env:
          COSIGN_PRIVATE_KEY: ${{ needs.version.outputs.publish == 'true' && secrets.COSIGN_PRIVATE_KEY || '' }}
          COSIGN_PASSWORD: ${{ needs.version.outputs.publish == 'true' && secrets.COSIGN_PASSWORD || '' }}
        run: |
          set -eu
          key="env://COSIGN_PRIVATE_KEY"
          [ "$PUBLISH" = true ] || key="$RUNNER_TEMP/keys/cosign.key"
          cd dist
          for f in ostrom-*.tar.gz ostrom-*.zip SHA256SUMS; do
            cosign sign-blob --yes --key "$key" --tlog-upload=false \
              --output-signature "$f.sig" "$f" >/dev/null
          done
      - name: Self-check the signatures
        run: |
          set -eu
          keys="$RUNNER_TEMP/keys"
          cd dist
          # cosign: verify with the public half of the key that signed
          for f in ostrom-*.tar.gz ostrom-*.zip SHA256SUMS; do
            cosign verify-blob --key "$keys/cosign.pub" --insecure-ignore-tlog --signature "$f.sig" "$f" >/dev/null
          done
          # SHA256SUMS.sig as install.sh checks it without cosign (openssl); install.ps1 reads the same DER with .NET
          tr -d ' \r\n' < SHA256SUMS.sig | openssl base64 -d -A -out "$RUNNER_TEMP/sums.der"
          openssl dgst -sha256 -verify "$keys/cosign.pub" -signature "$RUNNER_TEMP/sums.der" SHA256SUMS
          sha256sum -c SHA256SUMS
          # Ed25519 manifest
          base64 -d < latest.json.sig > "$RUNNER_TEMP/latest.sig"
          openssl pkeyutl -verify -pubin -inkey "$keys/release.pub" -rawin -in latest.json -sigfile "$RUNNER_TEMP/latest.sig"
          rm -f "$keys/release.key" "$keys/cosign.key"
      - name: Package-manager manifests and installers
        env:
          REPO: ${{ github.repository }}
        run: |
          set -eu
          base="https://github.com/$REPO/releases"
          mkdir -p extras/winget
          sh scripts/release/brew-formula.sh "$VERSION" "$base" dist > extras/ostrom.rb
          sh scripts/release/scoop-manifest.sh "$VERSION" "$base" dist > extras/ostrom.json
          sh scripts/release/winget-manifests.sh "$VERSION" "$base" dist extras/winget
          cp install/install.sh install/install.ps1 dist/
          (cd extras && tar -czf ../dist/winget-manifests-"$VERSION".tar.gz winget)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-extras
          path: extras
          if-no-files-found: error

  image:
    name: runner image (multi-arch)
    needs: [version, build-linux, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PUBLISH: ${{ needs.version.outputs.publish }}
      IMAGE: ghcr.io/ostrom-hq/ostrom-runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bin-linux
          path: bins
      - name: Image build context
        run: |
          set -eu
          mkdir -p image-context/amd64 image-context/arm64
          cp bins/linux-x64/ostrom image-context/amd64/ostrom
          cp bins/linux-arm64/ostrom image-context/arm64/ostrom
          chmod 755 image-context/*/ostrom
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with: { cache-image: false }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with: { cache-binary: false }
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: ${{ env.PUBLISH == 'true' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5
      - name: Build (and push on a tag)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: image-context
          file: docker/runner/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          sbom: true
          provenance: mode=max
      - name: Sign the image by digest (key, no transparency log)
        if: ${{ env.PUBLISH == 'true' }}
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false "$IMAGE@$DIGEST"

  publish:
    name: GitHub Release
    needs: [version, package, image]
    if: ${{ needs.version.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.version.outputs.version }}
      # Releases stay drafts while the repository is private (a draft is only visible to the team). Set the repository
      # variable RELEASE_DRAFT to `false` at the go (docs/RELEASES.md).
      RELEASE_DRAFT: ${{ vars.RELEASE_DRAFT || 'true' }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist
      - name: Create the release
        run: |
          set -eu
          flags=""
          [ "$RELEASE_DRAFT" = false ] || flags="--draft"
          case "$VERSION" in *-*) flags="$flags --prerelease" ;; esac
          # shellcheck disable=SC2086
          gh release create "$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --title "Ostrom $VERSION" \
            --generate-notes --verify-tag $flags

  taps:
    name: Homebrew tap and Scoop bucket
    needs: [version, publish]
    # Only once the release is public: the formula points at the release assets, which a draft does not serve.
    if: ${{ needs.version.outputs.publish == 'true' && vars.RELEASE_DRAFT == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # GitHub's published SSH host keys, the only ones the pushes below trust (no first-use trust, no system
      # known_hosts): the deploy keys write to the taps. The release's version job checks them first.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/release/github_known_hosts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-extras
          path: extras
      - name: Push the Homebrew formula
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY_TAP_WRITE }}
        run: |
          set -eu
          install -m 600 /dev/null "$RUNNER_TEMP/tap_key"; printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/tap_key"
          pins="$GITHUB_WORKSPACE/scripts/release/github_known_hosts"
          strict="-o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=$pins"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/tap_key -o IdentitiesOnly=yes $strict"
          git clone git@github.com:ostrom-hq/homebrew-tap.git tap
          mkdir -p tap/Formula && cp extras/ostrom.rb tap/Formula/ostrom.rb
          cd tap
          git config user.name "ostrom-release"; git config user.email "release@ostrom.run"
          git add Formula/ostrom.rb
          git diff --cached --quiet || { git commit -m "ostrom $VERSION"; git push origin HEAD:main; }
          rm -f "$RUNNER_TEMP/tap_key"
      - name: Push the Scoop manifest
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY_SCOOP_WRITE }}
        run: |
          set -eu
          install -m 600 /dev/null "$RUNNER_TEMP/scoop_key"; printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/scoop_key"
          pins="$GITHUB_WORKSPACE/scripts/release/github_known_hosts"
          strict="-o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=$pins"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/scoop_key -o IdentitiesOnly=yes $strict"
          git clone git@github.com:ostrom-hq/scoop-bucket.git bucket
          mkdir -p bucket/bucket && cp extras/ostrom.json bucket/bucket/ostrom.json
          cd bucket
          git config user.name "ostrom-release"; git config user.email "release@ostrom.run"
          git add bucket/ostrom.json
          git diff --cached --quiet || { git commit -m "ostrom $VERSION"; git push origin HEAD:main; }
          rm -f "$RUNNER_TEMP/scoop_key"
