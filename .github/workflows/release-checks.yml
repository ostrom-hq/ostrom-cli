name: Release checks

# Everything the release pipeline relies on: the installers, the manifest generators, the workflows' syntax and the
# runner image. On main and on demand, not on pull requests (org CI rules, JOURNAL 03:10: one `ci` job per PR).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  installers:
    name: installers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck and actionlint
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck jq
          # the download script at the commit of the v1.7.7 tag, not at the tag, which can move
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/03d0035246f3e81f36aed592ffb4bebf33a03106/scripts/download-actionlint.bash) 1.7.7
          sudo mv actionlint /usr/local/bin/
      - name: shellcheck
        run: shellcheck -x -S warning -s sh install/install.sh scripts/release/*.sh scripts/release/tests/*.sh install/tests/*.sh
      - name: actionlint
        run: actionlint
      - name: Release script tests (manifests, signing, Homebrew, Scoop, winget)
        run: sh scripts/release/tests/run.sh
      - name: install.sh against a fake release (good and bad checksums)
        run: sh install/tests/install.test.sh
      - name: The GitHub host keys the taps job pins are the published ones
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: sh scripts/release/check-github-host-keys.sh

  installers-macos:
    name: install.sh on macOS
    runs-on: macos-15
    timeout-minutes: 10
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # macOS ships LibreSSL, without Ed25519 raw signing: the release signs on Linux with OpenSSL 3, test with it too.
      - run: brew install jq openssl@3
      - run: |
          PATH="$(brew --prefix openssl@3)/bin:$PATH"
          openssl version
          sh scripts/release/tests/run.sh && sh install/tests/install.test.sh

  installer-windows:
    name: install.ps1 (Pester)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pester
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5 -Force -SkipPublisherCheck
          $config = New-PesterConfiguration
          $config.Run.Path = 'install/tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  runner-image:
    name: runner image (amd64, not pushed)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ostrom-core version
        id: core
        run: echo "ref=$(tr -d '[:space:]' < gradle/ostrom-core.ref)" >> "$GITHUB_OUTPUT"
      # GITHUB_TOKEN cannot read another repository's Maven packages: ostrom-core is built from its commit (05:50).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ostrom-hq/ostrom-core
          ref: ${{ steps.core.outputs.ref }}
          ssh-key: ${{ secrets.DEPLOY_KEY_CORE }}
          path: ostrom-core
          persist-credentials: false
      - name: Build ostrom-core from that checkout
        run: |
          mv ostrom-core ../ostrom-core
          mkdir -p ~/.gradle
          echo "ostrom.core.local=true" >> ~/.gradle/gradle.properties
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with: { cache-provider: basic }
      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-linux-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Install libcurl (Ktor's Linux engine)
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Link the linuxX64 release binary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :cli:linkReleaseExecutableLinuxX64
      - name: Build the image
        run: |
          mkdir -p image-context/amd64
          cp cli/build/bin/linuxX64/releaseExecutable/ostrom.kexe image-context/amd64/ostrom
          docker build -f docker/runner/Dockerfile --build-arg TARGETARCH=amd64 -t ostrom-runner:ci image-context
      - name: The CLI runs in the image
        run: docker run --rm ostrom-runner:ci version
      # The runner image only delivers `ostrom` (#155): the agents live in the session image. This is the server's
      # Docker delivery: the binary's directory copied into an empty volume by the runner's uid, then run read-only
      # from /opt/ostrom by the agent's.
      - name: The image delivers ostrom as the server's delivery container runs it
        run: |
          docker volume create ostrom-check-bin > /dev/null
          docker run --rm --user 1000:1000 --read-only --tmpfs /tmp -e HOME=/tmp --cap-drop ALL \
            -v ostrom-check-bin:/usr/local/bin ostrom-runner:ci --version
          docker run --rm --user 1001:1000 --read-only --tmpfs /tmp -e HOME=/tmp --cap-drop ALL \
            -v ostrom-check-bin:/opt/ostrom:ro --entrypoint /opt/ostrom/ostrom ostrom-runner:ci --version
          docker volume rm ostrom-check-bin > /dev/null
          # `ostrom cloud machine` refuses a missing configuration.
          set +e
          docker run --rm ostrom-runner:ci cloud machine; machine=$?
          set -e
          test "$machine" = 2
      # The session image template on that runner image: its own contract check runs at build time (ostrom as both
      # uids, the agent CLIs as 1001); the agents then run from the default user.
      - name: The session image template builds on it, and its agents run
        run: |
          docker build -f docker/cloud-session-image/Dockerfile --build-arg OSTROM_RUNNER_IMAGE=ostrom-runner:ci \
            -t ostrom-session:ci docker/cloud-session-image
          docker run --rm --entrypoint claude ostrom-session:ci --version
          docker run --rm --entrypoint codex ostrom-session:ci --version
          test "$(docker run --rm --entrypoint id ostrom-session:ci -u):$(docker run --rm --entrypoint id ostrom-session:ci -g)" = 1001:1000
