# CI of ostrom-cli (ostrom-core CONVENTIONS.md section 11). Pull requests: Linux only, jvm and linuxX64 only (CI cost,
# orchestrator 05:10), one required check `ci` (conventions, detekt, jvmTest + koverVerify 100 %, linuxX64Test, the
# linuxX64 release binary and the hook start-up budget). On main and on demand (full_validation), `ci` also links the
# linuxArm64 and mingwX64 tests and binaries, which then run on linuxArm64 and Windows runners, and macosArm64 is
# built and tested. No run on tags: the release workflow
# publishes, and a cache in a publishing workflow is refused by zizmor (cache poisoning).
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_validation:
        description: 'Also run linuxArm64, Windows and macOS'
        type: boolean
        default: false

env:
  # Main and full_validation build every target; a pull request only jvm and linuxX64.
  FULL: ${{ github.event_name == 'push' || inputs.full_validation == true }}
  ORG_GRADLE_PROJECT_ostromVersion: ${{ github.ref_type == 'tag' && github.ref_name || '0.1.0-SNAPSHOT' }}
  # The usage statistics destination, compiled into release builds only (a public, write-only PostHog project key,
  # kept in the repository variable OSTROM_POSTHOG_KEY). Unset, or any other build: no destination, nothing sent.
  ORG_GRADLE_PROJECT_ostromPosthogKey: ${{ github.ref_type == 'tag' && vars.OSTROM_POSTHOG_KEY || '' }}
  KOTLIN_VERSION: '2.4.21'
  GRADLE_OPTS: -Dorg.gradle.daemon=false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    # Drafts do not use runners (orchestrator, 03:10): the run starts when the PR is marked ready.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # The real server's image, ghcr.io/ostrom-hq/ostrom-server (private), for the journey against the real server.
      packages: read
    env:
      HAS_SERVER_KEY: ${{ secrets.DEPLOY_KEY_SERVER != '' }}
    # The real server's database, for the CLI's journey against the real server (as ostrom-web's journeys). The
    # database is `ostrom_ci`: ci/database-roles.sql of ostrom-server creates `ostrom` itself, owned by its owner role.
    services:
      postgres:
        image: postgres:18@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
        env: { POSTGRES_USER: ostrom, POSTGRES_PASSWORD: ostrom, POSTGRES_DB: ostrom_ci }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ostrom -d ostrom_ci" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ostrom-core version
        id: core
        run: echo "ref=$(tr -d '[:space:]' < gradle/ostrom-core.ref)" >> "$GITHUB_OUTPUT"
      # GITHUB_TOKEN cannot read another repository's Maven packages: ostrom-core is built from its commit (05:50).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ostrom-hq/ostrom-core
          ref: ${{ steps.core.outputs.ref }}
          ssh-key: ${{ secrets.DEPLOY_KEY_CORE }}
          path: ostrom-core
          persist-credentials: false
      - name: Build ostrom-core from that checkout
        run: |
          mv ostrom-core ../ostrom-core
          mkdir -p ~/.gradle
          echo "ostrom.core.local=true" >> ~/.gradle/gradle.properties
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      # The Kotlin/Native toolchain and its dependencies (~1 GB) are not in the Gradle cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ env.KOTLIN_VERSION }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-${{ env.KOTLIN_VERSION }}-
      # libcurl for Ktor's Linux engine; GNOME Keyring for the Secret Service test of the secret store.
      - name: Install native link and test dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev gnome-keyring dbus libsecret-1-0
      - name: Never serve a test task from the cache (ENG-032)
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/always-run-tests.gradle.kts <<'KTS'
          allprojects {
              tasks.withType<AbstractTestTask>().configureEach {
                  outputs.cacheIf { false }
                  outputs.upToDateWhen { false }
              }
          }
          KTS
      - run: python3 scripts/check-conventions.py --self-test && python3 scripts/check-conventions.py
      # Coverage first, in its own step, so that its report is printed even when the native links that follow are cut
      # short (a runner lost while linking used to cancel the job before the report, ostrom-cli#25 and #27).
      - name: detekt, JVM tests and coverage (100 % lines and branches)
        env:
          OSTROM_NETWORK_TESTS: '1'
        run: ./gradlew --continue detekt jvmTest koverXmlReport koverVerify
      - name: Lines and branches not covered
        if: failure()
        run: python3 scripts/uncovered.py
      # On a private session bus with an unlocked GNOME Keyring, the linuxX64 tests use the real Secret Service. The
      # links run two at a time: several Kotlin/Native links at once exhaust the runner's memory (JOURNAL 06:52).
      - name: linuxX64 tests; other targets linked when FULL
        if: ${{ !cancelled() }}
        env:
          OSTROM_NETWORK_TESTS: '1'
          OSTROM_SECRET_SERVICE_TESTS: '1'
        run: |
          # the script is the inner bash's: its variables expand there, inside the D-Bus session
          # shellcheck disable=SC2016
          dbus-run-session -- bash -ec '
            printf ci-keyring | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            other=()
            if [ "$FULL" = true ]; then
              other=(linkDebugTestLinuxArm64 linkDebugTestMingwX64
                :cli:linkReleaseExecutableLinuxArm64 :cli:linkReleaseExecutableMingwX64)
            fi
            ./gradlew --continue --max-workers=2 \
              linuxX64Test :cli:linkReleaseExecutableLinuxX64 "${other[@]}"
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-reports
          path: '**/build/reports/**'
          retention-days: 7
      # mingwX64 has a budget of its own: 16.3 MB with the options that put the others under 15 (17.6 before);
      # under 15 means removing code, not a build option (JOURNAL 03/11). Start-up and memory, measured on 03/11
      # (run 41541750442): hook p95 5.1 ms, version p95 6.9 ms, the hook's peak memory 13.7 MB, which is Python's own
      # floor on Linux (measure.py, peak_memory_mb; 6.5 MB on macOS). A start with the file cache emptied, median of 5:
      # 29-89 ms on x64, up to 114 ms on arm64 (runs 41541750442, 41612349833, 41625900506, 41628920178; one start
      # reached 620 ms). Budgets: 20 ms (perf pass), 30 ms, 300 ms and 25 MB, the runner's noise left.
      - name: Start-up (15 ms median, 20 ms p95, 40 ms for a git push), first start, memory and binary sizes
        run: >-
          python3 scripts/measure.py --label linuxX64 --max-push-ms 40
          --binary cli/build/bin/linuxX64/releaseExecutable/ostrom.kexe
          --sizes cli/build/bin/*/releaseExecutable/ostrom.* --max-size-mb 15 --size-budget mingwX64=17
          --max-hook-p95-ms 20 --max-version-p95-ms 30 --max-cold-ms 300 --max-hook-memory-mb 25
      - name: End to end, the real binary with fake Claude Code and Codex against the contract's server
        run: python3 e2e/run.py --binary cli/build/bin/linuxX64/releaseExecutable/ostrom.kexe
      # What a hook costs the agent at every tool call, median of 20 (e2e/perf.py): first starts, the hook in a session
      # with no action and with 50 and a gate, the requests to Ostrom a hook waits on, the binary's size.
      - name: Hook cost in a session (median of 20)
        run: python3 e2e/perf.py --binary cli/build/bin/linuxX64/releaseExecutable/ostrom.kexe --label linuxX64
      - name: End to end, init, invite, members, policy and harness against the contract's server
        run: python3 e2e/setup_e2e.py --binary cli/build/bin/linuxX64/releaseExecutable/ostrom.kexe
      - name: End to end, every command of the real binary (help, exit codes, colours, completion)
        # in a D-Bus session with an unlocked keyring, like a developer's desktop: the doctor checks the secret store
        run: |
          dbus-run-session -- bash -ec '
            printf ci-keyring | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            python3 e2e/commands.py --binary cli/build/bin/linuxX64/releaseExecutable/ostrom.kexe
          '
      # The same binary against the REAL server: the image of ostrom-server main, as deployed (the owner role migrates,
      # the server serves as `ostrom_app`, which owns nothing and cannot bypass row-level security).
      - name: ostrom-server main (its database roles)
        # Without the deploy key (a pull request from outside), the journey against the real server is skipped.
        if: env.HAS_SERVER_KEY == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ostrom-hq/ostrom-server
          ref: main
          ssh-key: ${{ secrets.DEPLOY_KEY_SERVER }}
          path: .ostrom/server
          # The whole history: whether the image's commit contains the oldest server the CLI needs, and its own roles.
          fetch-depth: 0
          persist-credentials: false
      # Until the image can be pulled (Actions access of the package for ostrom-cli, a gesture of Lyes) and contains the
      # oldest server the journey needs (MIN_SERVER: server#62, the device poll of the contract), the journey is
      # skipped with a warning and a line in the summary; with the repository variable OSTROM_CLI_REQUIRE_REAL_SERVER
      # set to `true`, a skip fails the job.
      - name: Real server image (edge of ostrom-server main)
        id: server
        env:
          IMAGE: ghcr.io/ostrom-hq/ostrom-server:edge
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIN_SERVER: b7f954a
          REQUIRED: ${{ vars.OSTROM_CLI_REQUIRE_REAL_SERVER == 'true' }}
        run: |
          skip() {
            echo "::warning title=Journey against the real server skipped::$1"
            echo "The CLI journey against the real server **skipped**: $1" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            [ "$REQUIRED" = "true" ] && exit 1
            exit 0
          }
          if [ "$HAS_SERVER_KEY" != "true" ]; then
            # Never fatal: a pull request from outside has no deploy key.
            echo "::warning title=Journey against the real server skipped::no deploy key for ostrom-server"
            echo "The CLI journey against the real server **skipped**: no deploy key for ostrom-server." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull --quiet "$IMAGE" || skip "$IMAGE cannot be pulled from this repository (package Actions access)."
          revision=$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")
          main=$(git -C .ostrom/server rev-parse HEAD)
          echo "Server image built from ostrom-server@${revision:0:7}; main is at ${main:0:7}." >> "$GITHUB_STEP_SUMMARY"
          [ -n "$revision" ] || skip "$IMAGE carries no org.opencontainers.image.revision label."
          git -C .ostrom/server cat-file -e "${revision}^{commit}" 2>/dev/null \
            || skip "edge is ostrom-server@${revision:0:7}, a commit that is not in the history of main."
          git -C .ostrom/server merge-base --is-ancestor "$MIN_SERVER" "$revision" \
            || skip "edge is ostrom-server@${revision:0:7}, older than $MIN_SERVER (server#62)."
          # The database roles of the image's own commit, not of a main that may have moved past it.
          git -C .ostrom/server show "${revision}:ci/database-roles.sql" > "$RUNNER_TEMP/database-roles.sql"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Start the real server (roles, migrate, serve as ostrom_app)
        if: steps.server.outputs.ready == 'true'
        env:
          IMAGE: ghcr.io/ostrom-hq/ostrom-server:edge
          PGPASSWORD: ostrom
          OWNER_URL: postgresql://ostrom_owner:ostrom_owner@localhost:5432/ostrom
        run: |
          psql -h localhost -U ostrom -d ostrom_ci -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/database-roles.sql"
          docker run --rm --network host -e OSTROM_DATABASE_MIGRATION_URL="$OWNER_URL" "$IMAGE" migrate
          # 2.9: the journey's fake MCP server is HTTPS on 127.0.0.1, with a certificate made here for this run only;
          # the server trusts it (the system's authorities plus it, mounted over the image's bundle) and, in this
          # workflow only, may reach a private address (OSTROM_MCP_ALLOW_PRIVATE_UPSTREAMS below, never a default).
          mkdir -p "$RUNNER_TEMP/fake-mcp"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=127.0.0.1" \
            -addext "subjectAltName=IP:127.0.0.1" -addext "basicConstraints=critical,CA:TRUE" \
            -keyout "$RUNNER_TEMP/fake-mcp/key.pem" -out "$RUNNER_TEMP/fake-mcp/cert.pem"
          cat /etc/ssl/certs/ca-certificates.crt "$RUNNER_TEMP/fake-mcp/cert.pem" > "$RUNNER_TEMP/fake-mcp/bundle.pem"
          chmod 0644 "$RUNNER_TEMP/fake-mcp/bundle.pem"
          # The server's non-root user writes the mails (0644); the journey, as the runner's user, reads them.
          mkdir -p "$RUNNER_TEMP/ostrom-mail" && chmod 0777 "$RUNNER_TEMP/ostrom-mail"
          # Test values only: sign-in mails are written to a directory, the console is the server's own origin (the
          # page of ostrom login's code), Stripe is never called by the journey.
          cat > "$RUNNER_TEMP/server.env" <<'ENV'
          OSTROM_DATABASE_URL=postgresql://ostrom_app:ostrom_app@localhost:5432/ostrom
          OSTROM_PORT=4600
          OSTROM_MAIL_DIR=/var/lib/ostrom/mail
          OSTROM_PUBLIC_URL=http://127.0.0.1:4600
          OSTROM_CONSOLE_URL=http://127.0.0.1:4600
          OSTROM_STRIPE_SECRET_KEY=sk_test_cli_e2e
          OSTROM_STRIPE_WEBHOOK_SECRET=whsec_cli_e2e
          OSTROM_STRIPE_API_BASE=http://127.0.0.1:12111
          OSTROM_MCP_ALLOW_PRIVATE_UPSTREAMS=true
          SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
          ENV
          sed -i 's/^ *//' "$RUNNER_TEMP/server.env"
          docker run -d --name ostrom-server --network host -v "$RUNNER_TEMP/ostrom-mail:/var/lib/ostrom/mail" \
            -v "$RUNNER_TEMP/fake-mcp/bundle.pem:/etc/ssl/certs/ca-certificates.crt:ro" \
            --env-file "$RUNNER_TEMP/server.env" "$IMAGE"
          for _ in $(seq 1 60); do curl -fsS 127.0.0.1:4600/ready >/dev/null 2>&1 && exit 0; sleep 1; done
          docker logs ostrom-server; exit 1
      # demo/PARCOURS.md on the CLI side, from ostrom login to ostrom claude (e2e/journey.py, the script of the film).
      # A step whose route is not on main yet is skipped and named in the summary; OSTROM_CLI_REQUIRE_ALL_ROUTES=true
      # makes such a skip fail once the server serves the whole journey.
      - name: End to end, the CLI journey against the real server (login to claude)
        if: steps.server.outputs.ready == 'true'
        env:
          IMAGE: ghcr.io/ostrom-hq/ostrom-server:edge
          OSTROM_E2E_STRICT: ${{ vars.OSTROM_CLI_REQUIRE_ALL_ROUTES == 'true' }}
        run: >-
          python3 e2e/journey.py --binary cli/build/bin/linuxX64/releaseExecutable/ostrom.kexe
          --server http://127.0.0.1:4600 --mail-dir "$RUNNER_TEMP/ostrom-mail" --report "$RUNNER_TEMP/journey.json"
          --fake-mcp-port 4630 --fake-mcp-cert "$RUNNER_TEMP/fake-mcp/cert.pem"
          --fake-mcp-key "$RUNNER_TEMP/fake-mcp/key.pem"
          --seed "docker run --rm --network host --env-file $RUNNER_TEMP/server.env -e OSTROM_ALLOW_TEST_ACCOUNTS=true
          $IMAGE seed-test-account"
      - name: Real server logs
        if: always() && steps.server.outputs.ready == 'true'
        run: docker logs ostrom-server 2>&1 | tail -n 200
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.server.outputs.ready == 'true'
        with:
          name: journey-report
          path: ${{ runner.temp }}/journey.json
          retention-days: 7
      - name: The bench's build contract
        run: ./ci/build-linux.sh && ldd dist/ostrom
      # docs-truth (ostrom-core's tools/docs-truth) at a pinned commit, whose api/contract/served-routes.txt says what
      # ostrom-server main serves; moved out of the workspace, so that no check of this repository scans it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ostrom-hq/ostrom-core
          ref: 57ec021511e772a54f7ee7f8b869baff410670ff # docs-truth and served-routes.txt; move it forward by pull request
          ssh-key: ${{ secrets.DEPLOY_KEY_CORE }}
          path: docs-truth-core
          persist-credentials: false
      - name: The README and docs/ cite only this binary's commands, routes main serves, variables read here (docs-truth)
        run: |
          mv docs-truth-core "$RUNNER_TEMP/docs-truth-core"
          core="$RUNNER_TEMP/docs-truth-core"
          node "$core/tools/docs-truth/bin/docs-truth.mjs" --routes "$core/api/contract/served-routes.txt" \
            --ostrom dist/ostrom --tests --source . --source "$core/telemetry" README.md docs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ostrom-binaries
          path: cli/build/bin/*/releaseExecutable/ostrom.*
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.FULL == 'true'
        with:
          name: tests-linuxArm64
          path: '*/build/bin/linuxArm64/debugTest/test.kexe'
          retention-days: 2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.FULL == 'true'
        with:
          name: tests-mingwX64
          path: '*/build/bin/mingwX64/debugTest/test.exe'
          retention-days: 2

  linux-arm64:
    needs: ci
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.full_validation)
    timeout-minutes: 15
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tests-linuxArm64
          path: tests
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ostrom-binaries
          path: bin
      - name: Install libcurl (Ktor's Linux engine)
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Every module's tests, cross-compiled on Linux x64
        env:
          OSTROM_NETWORK_TESTS: '1'
        run: |
          test "$(uname -m)" = aarch64
          find tests -name test.kexe -print0 | sort -z | while IFS= read -r -d '' t; do
            # stdin is the list being read: a test that reads its stdin must never eat the next binaries' names
            echo "::group::$t"; chmod 755 "$t"; "$t" < /dev/null; echo "::endgroup::"
          done
      - name: Start-up, first start and memory budgets
        run: >-
          chmod 755 bin/linuxArm64/releaseExecutable/ostrom.kexe &&
          python3 scripts/measure.py --label linuxArm64 --binary bin/linuxArm64/releaseExecutable/ostrom.kexe
          --max-hook-p95-ms 20 --max-version-p95-ms 30 --max-cold-ms 300 --max-hook-memory-mb 25

  windows:
    needs: ci
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.full_validation)
    timeout-minutes: 15
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tests-mingwX64
          path: tests
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ostrom-binaries
          path: bin
      - name: Every module's tests, cross-compiled on Linux x64
        shell: pwsh
        env:
          OSTROM_NETWORK_TESTS: '1'
        run: |
          $failed = $false
          foreach ($t in Get-ChildItem -Recurse -Filter test.exe tests | Sort-Object FullName) {
            Write-Host "::group::$($t.FullName)"
            & $t.FullName
            if ($LASTEXITCODE -ne 0) { $failed = $true }
            Write-Host "::endgroup::"
          }
          if ($failed) { exit 1 }
      # Process creation costs more on Windows: the budget there is 40 ms, the 15 ms one is Linux's.
      - name: Hook start-up
        run: python scripts/measure.py --label mingwX64 --binary bin/mingwX64/releaseExecutable/ostrom.exe --max-hook-ms 40

  macos:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.full_validation)
    timeout-minutes: 45
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ostrom-core version
        id: core
        run: echo "ref=$(tr -d '[:space:]' < gradle/ostrom-core.ref)" >> "$GITHUB_OUTPUT"
      # GITHUB_TOKEN cannot read another repository's Maven packages: ostrom-core is built from its commit (05:50).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ostrom-hq/ostrom-core
          ref: ${{ steps.core.outputs.ref }}
          ssh-key: ${{ secrets.DEPLOY_KEY_CORE }}
          path: ostrom-core
          persist-credentials: false
      - name: Build ostrom-core from that checkout
        run: |
          mv ostrom-core ../ostrom-core
          mkdir -p ~/.gradle
          echo "ostrom.core.local=true" >> ~/.gradle/gradle.properties
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ env.KOTLIN_VERSION }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-${{ env.KOTLIN_VERSION }}-
      - name: macosArm64 tests and release binary
        env:
          OSTROM_NETWORK_TESTS: '1'
        run: ./gradlew macosArm64Test :cli:linkReleaseExecutableMacosArm64
      # macOS runners differ from one machine to the next by about 3 times, with no change to the code. On 03/11: hook
      # median 7 and p95 10.7 ms in the morning (run 41612349833), then 13.3-15.3 and 20.5-25.5 ms from 10:00 (runs
      # 41617836625, 41621223496, 41621434860); version p95 10, then 26-32 ms; a start with the file cache emptied,
      # median of 5, 240-640 ms. Linux did not move, and the hook's own time stayed under 1 ms (0.45, then 0.75).
      # Budgets of about twice the slow runner: they catch a start-up several times slower; the precise ones are held
      # on Linux.
      - name: Start-up, first start, memory and size budgets
        run: >-
          python3 scripts/measure.py --label macosArm64
          --binary cli/build/bin/macosArm64/releaseExecutable/ostrom.kexe
          --sizes cli/build/bin/macosArm64/releaseExecutable/ostrom.kexe --max-size-mb 15
          --max-hook-ms 30 --max-hook-p95-ms 45 --max-version-p95-ms 60 --max-cold-ms 1500 --max-hook-memory-mb 25
      - name: Hook cost in a session (median of 20)
        run: python3 e2e/perf.py --binary cli/build/bin/macosArm64/releaseExecutable/ostrom.kexe --label macosArm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ostrom-macosArm64
          path: cli/build/bin/macosArm64/releaseExecutable/ostrom.kexe
          retention-days: 7
