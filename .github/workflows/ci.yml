# CI of ostrom-cli (ostrom-core CONVENTIONS.md section 11). Pull requests: Linux only, one required check `ci`
# (conventions, detekt, jvmTest + koverVerify 100 %, linuxX64Test, the linuxArm64 and mingwX64 links, the release
# binaries and the hook start-up budget). On main and on demand (full_validation), the cross-compiled test binaries
# also run on linuxArm64 and Windows runners, and macosArm64 is built and tested. No run on tags: the release workflow
# publishes, and a cache in a publishing workflow is refused by zizmor (cache poisoning).
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_validation:
        description: 'Also run linuxArm64, Windows and macOS'
        type: boolean
        default: false

env:
  ORG_GRADLE_PROJECT_ostromVersion: ${{ github.ref_type == 'tag' && github.ref_name || '0.1.0-SNAPSHOT' }}
  # The usage statistics destination, compiled into release builds only (a public, write-only PostHog project key,
  # kept in the repository variable OSTROM_POSTHOG_KEY). Unset, or any other build: no destination, nothing sent.
  ORG_GRADLE_PROJECT_ostromPosthogKey: ${{ github.ref_type == 'tag' && vars.OSTROM_POSTHOG_KEY || '' }}
  KOTLIN_VERSION: '2.4.21'
  GRADLE_OPTS: -Dorg.gradle.daemon=false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    # Drafts do not use runners (orchestrator, 03:10): the run starts when the PR is marked ready.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      # The Kotlin/Native toolchain and its dependencies (~1 GB) are not in the Gradle cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ env.KOTLIN_VERSION }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-${{ env.KOTLIN_VERSION }}-
      - name: Install native link dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Never serve a test task from the cache (ENG-032)
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/always-run-tests.gradle.kts <<'KTS'
          allprojects {
              tasks.withType<AbstractTestTask>().configureEach {
                  outputs.cacheIf { false }
                  outputs.upToDateWhen { false }
              }
          }
          KTS
      - run: python3 scripts/check-conventions.py --self-test && python3 scripts/check-conventions.py
      # Coverage first, in its own step, so that its report is printed even when the native links that follow are cut
      # short (a runner lost while linking used to cancel the job before the report, ostrom-cli#25).
      - name: detekt, JVM tests and coverage (100 % lines and branches)
        env:
          OSTROM_NETWORK_TESTS: '1'
        run: ./gradlew --continue detekt jvmTest koverXmlReport koverVerify
      - name: Lines and branches not covered
        if: failure()
        run: python3 scripts/uncovered.py
      - name: linuxX64 tests; other targets linked
        if: ${{ !cancelled() }}
        env:
          OSTROM_NETWORK_TESTS: '1'
        run: >-
          ./gradlew --continue
          linuxX64Test
          linkDebugTestLinuxArm64 linkDebugTestMingwX64
          :cli:linkReleaseExecutableLinuxX64 :cli:linkReleaseExecutableLinuxArm64 :cli:linkReleaseExecutableMingwX64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-reports
          path: '**/build/reports/**'
          retention-days: 7
      - name: Hook start-up budget (15 ms median) and binary sizes
        run: >-
          python3 scripts/measure.py --label linuxX64
          --binary cli/build/bin/linuxX64/releaseExecutable/ostrom.kexe
          --sizes cli/build/bin/linuxX64/releaseExecutable/ostrom.kexe
          cli/build/bin/linuxArm64/releaseExecutable/ostrom.kexe
          cli/build/bin/mingwX64/releaseExecutable/ostrom.exe
      - name: End to end, the real binary with fake Claude Code and Codex against the contract's server
        run: python3 e2e/run.py --binary cli/build/bin/linuxX64/releaseExecutable/ostrom.kexe
      - name: The bench's build contract
        run: ./ci/build-linux.sh && ldd dist/ostrom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ostrom-binaries
          path: cli/build/bin/*/releaseExecutable/ostrom.*
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-linuxArm64
          path: '*/build/bin/linuxArm64/debugTest/test.kexe'
          retention-days: 2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-mingwX64
          path: '*/build/bin/mingwX64/debugTest/test.exe'
          retention-days: 2

  linux-arm64:
    needs: ci
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.full_validation)
    timeout-minutes: 15
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tests-linuxArm64
          path: tests
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ostrom-binaries
          path: bin
      - name: Install libcurl (Ktor's Linux engine)
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Every module's tests, cross-compiled on Linux x64
        env:
          OSTROM_NETWORK_TESTS: '1'
        run: |
          test "$(uname -m)" = aarch64
          find tests -name test.kexe -print0 | sort -z | while IFS= read -r -d '' t; do
            # stdin is the list being read: a test that reads its stdin must never eat the next binaries' names
            echo "::group::$t"; chmod 755 "$t"; "$t" < /dev/null; echo "::endgroup::"
          done
      - name: Hook start-up budget
        run: >-
          chmod 755 bin/linuxArm64/releaseExecutable/ostrom.kexe &&
          python3 scripts/measure.py --label linuxArm64 --binary bin/linuxArm64/releaseExecutable/ostrom.kexe

  windows:
    needs: ci
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.full_validation)
    timeout-minutes: 15
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tests-mingwX64
          path: tests
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ostrom-binaries
          path: bin
      - name: Every module's tests, cross-compiled on Linux x64
        shell: pwsh
        env:
          OSTROM_NETWORK_TESTS: '1'
        run: |
          $failed = $false
          foreach ($t in Get-ChildItem -Recurse -Filter test.exe tests | Sort-Object FullName) {
            Write-Host "::group::$($t.FullName)"
            & $t.FullName
            if ($LASTEXITCODE -ne 0) { $failed = $true }
            Write-Host "::endgroup::"
          }
          if ($failed) { exit 1 }
      # Process creation costs more on Windows: the budget there is 40 ms, the 15 ms one is Linux's.
      - name: Hook start-up
        run: python scripts/measure.py --label mingwX64 --binary bin/mingwX64/releaseExecutable/ostrom.exe --max-hook-ms 40

  macos:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.full_validation)
    timeout-minutes: 45
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ env.KOTLIN_VERSION }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-${{ env.KOTLIN_VERSION }}-
      - name: macosArm64 tests and release binary
        env:
          OSTROM_NETWORK_TESTS: '1'
        run: ./gradlew macosArm64Test :cli:linkReleaseExecutableMacosArm64
      - name: Hook start-up budget and size
        run: >-
          python3 scripts/measure.py --label macosArm64
          --binary cli/build/bin/macosArm64/releaseExecutable/ostrom.kexe
          --sizes cli/build/bin/macosArm64/releaseExecutable/ostrom.kexe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ostrom-macosArm64
          path: cli/build/bin/macosArm64/releaseExecutable/ostrom.kexe
          retention-days: 7
