org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
kotlin.mpp.applyDefaultHierarchyTemplate=true
kotlin.native.ignoreDisabledTargets=true
ostrom.nativeTargets=macosArm64,linuxX64,linuxArm64,mingwX64
# Version of the CLI, printed by `ostrom version`. CI overrides it with -PostromVersion=<tag>.
ostromVersion=0.1.0-SNAPSHOT
# Version of ostrom-core on GitHub Packages. Empty until ostrom-core publishes its first version:
# the api-client module then builds without it. A local clone next to this one wins (includeBuild).
ostromCoreVersion=
