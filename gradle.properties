org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
kotlin.mpp.applyDefaultHierarchyTemplate=true
kotlin.native.ignoreDisabledTargets=true
ostrom.nativeTargets=macosArm64,linuxX64,linuxArm64,mingwX64
# Version of the CLI, printed by `ostrom version`. CI overrides it with -PostromVersion=<tag>.
ostromVersion=0.1.0-SNAPSHOT
# Version of ostrom-core on GitHub Packages (0.1.<run of its main build>, with the JVM variant the coverage target
# needs). CI builds it from the commit that published this version, written in gradle/ostrom-core.ref: change both
# together.
ostromCoreVersion=0.1.440
